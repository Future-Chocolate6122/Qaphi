{{define "content"}}
<section class="card narrow">
  <h1>{{t "setup.title"}}</h1>
  <p class="muted">{{t "setup.intro"}}</p>
  {{with .Body.Error}}<p class="alert" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <div class="field">
      <label for="f-token">{{t "setup.token"}}</label>
      <input id="f-token" name="token" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required placeholder="XXXX-XXXX-XXXX-XXXX">
      <small class="help">{{t "setup.token.help"}}</small>
    </div>
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <div class="field">
      <label for="f-password">{{t "setup.password"}}</label>
      <input id="f-password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <small class="help">{{t "auth.err.password_short"}}</small>
    </div>
    <div class="field">
      <label for="f-confirm">{{t "setup.confirm"}}</label>
      <input id="f-confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <button type="submit" class="primary">{{t "setup.submit"}}</button>
  </form>
</section>
{{end}}
